[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "managed-crawler-ip-pool-gateway"
version = "0.4.0"
description = "A target-aware, multi-lane proxy gateway for local crawlers"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "requests>=2.31",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
crawler-gateway = "crawler_gateway.cli:main"

[tool.setuptools.packages.find]
include = ["crawler_gateway*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
